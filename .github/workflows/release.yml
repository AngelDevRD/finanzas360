name: Release

# Reemplaza a codemagic.yaml (nunca conectada como app en Codemagic, sin builds
# reales). Requiere los secrets SUPABASE_URL, SUPABASE_ANON_KEY,
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
# ANDROID_KEY_PASSWORD configurados en Settings > Secrets and variables >
# Actions de este repo. Los ANDROID_* firman el APK release con una llave
# estable -- sin ellos, Android rechaza instalar una version nueva encima de
# una anterior (ver commit que agrego esto).
#
# Publicar una version es un solo gesto: pushear un tag v*.*.* . La version
# dentro de la APK (build-name/build-number) se deriva del tag, no de
# pubspec.yaml -- pubspec.yaml ya no es una fuente de verdad de version.
on:
  push:
    branches:
      - master
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "windows/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      name: ${{ steps.compute.outputs.name }}
      skip: ${{ steps.compute.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular tag y version del release
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git log -1 --pretty=%B | grep -qF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit marcado con [skip release]: se omite el release."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            LATEST=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || true)
            if [ -z "$LATEST" ]; then
              TAG="v1.0.0"
            else
              TAG=$(node -e "
                const m = process.argv[1].replace(/^v/i, '').match(/^(\d+)\.(\d+)\.(\d+)/);
                console.log('v' + m[1] + '.' + m[2] + '.' + (Number(m[3]) + 1));
              " "$LATEST")
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

  verify-version:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que el tag es superior al ultimo release publicado
        run: node tools/verify-release-version.mjs --repo ${{ github.repository }} --new "${{ needs.version.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: [version, verify-version]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable

      - run: flutter pub get

      - run: flutter test

      - name: Restaurar keystore de firma release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Compilar APK (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Renombrar artefacto
        run: cp build/app/outputs/flutter-apk/app-release.apk finanzas360-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: finanzas360-android.apk

  build-windows:
    needs: [version, verify-version]
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Compilar Windows (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build windows --release `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
        shell: pwsh

      - name: Empaquetar build de Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath finanzas360-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: finanzas360-windows.zip

  release:
    needs: [version, build-android, build-windows]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            android-apk/finanzas360-android.apk
            windows-zip/finanzas360-windows.zip
