name: Release APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - run: flutter pub get

      - run: flutter test

      - run: flutter build apk --release

      - name: Rename APK with version
        run: cp build/app/outputs/flutter-apk/app-release.apk finanzas360-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: finanzas360-${{ github.ref_name }}.apk
          generate_release_notes: true
